      - name: Notify Slack
        if: always() && (inputs.force_app_changed == 'true' || job.status != 'success')
        run: |
          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "No SLACK_WEBHOOK_URL configured, skipping notification."
            exit 0
          fi

          STATUS_EMOJI="✅"
          if [ "${{ job.status }}" != "success" ]; then
            STATUS_EMOJI="❌"
          fi

          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"$STATUS_EMOJI *${{ github.workflow }}* on *${{ github.repository }}* (${{ github.ref_name }}) by ${{ github.actor }} - event: ${{ github.event_name }} - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
